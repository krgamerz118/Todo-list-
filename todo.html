<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karan Rathod Todo App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#020617,#0f172a,#111827);
    color:white;
}

.background{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(5px);
    animation:float 10s infinite linear;
}

.circle:nth-child(1){
    width:250px;
    height:250px;
    background:rgba(255,0,0,0.15);
    top:10%;
    left:5%;
}

.circle:nth-child(2){
    width:300px;
    height:300px;
    background:rgba(0,100,255,0.15);
    bottom:5%;
    right:5%;
}

.circle:nth-child(3){
    width:180px;
    height:180px;
    background:rgba(255,255,255,0.08);
    top:60%;
    left:40%;
}

@keyframes float{
    0%{
        transform:translateY(0px) rotate(0deg);
    }
    50%{
        transform:translateY(-30px) rotate(180deg);
    }
    100%{
        transform:translateY(0px) rotate(360deg);
    }
}

.container{
    position:relative;
    width:430px;
    padding:30px;
    border-radius:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

.title{
    text-align:center;
    margin-bottom:20px;
}

.title h1{
    font-size:38px;
    font-weight:700;
    background:linear-gradient(90deg,#ff0000,#0066ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.title p{
    margin-top:5px;
    opacity:0.7;
}

.clock{
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,0.05);
    text-align:center;
    margin-bottom:25px;
    border:1px solid rgba(255,255,255,0.08);
}

#time{
    font-size:40px;
    font-weight:700;
    letter-spacing:2px;
    color:#ffffff;
}

#date{
    margin-top:8px;
    opacity:0.8;
    font-size:15px;
}

.inputBox{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

.inputBox input{
    flex:1;
    padding:15px;
    border:none;
    border-radius:16px;
    outline:none;
    background:#1e293b;
    color:white;
    font-size:16px;
}

.inputBox button{
    width:65px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    font-size:28px;
    color:white;
    background:linear-gradient(135deg,#ff0000,#0066ff);
    transition:0.3s;
}

.inputBox button:hover{
    transform:scale(1.08);
}

ul{
    list-style:none;
    max-height:280px;
    overflow-y:auto;
}

li{
    background:rgba(255,255,255,0.05);
    margin-bottom:14px;
    padding:15px;
    border-radius:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    animation:slide 0.4s ease;
    border:1px solid rgba(255,255,255,0.08);
}

@keyframes slide{
    from{
        transform:translateX(50px);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

.task{
    font-size:16px;
    word-break:break-word;
}

.completed{
    text-decoration:line-through;
    opacity:0.5;
}

.actions{
    display:flex;
    gap:8px;
}

.doneBtn,
.deleteBtn{
    border:none;
    padding:9px 13px;
    border-radius:12px;
    color:white;
    cursor:pointer;
    transition:0.3s;
    font-size:15px;
}

.doneBtn{
    background:#16a34a;
}

.deleteBtn{
    background:#dc2626;
}

.doneBtn:hover,
.deleteBtn:hover{
    transform:scale(1.1);
}

.footer{
    margin-top:22px;
    text-align:center;
    font-size:15px;
    font-weight:600;
    background:linear-gradient(90deg,#ff0000,#0066ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:1px;
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:linear-gradient(#ff0000,#0066ff);
    border-radius:20px;
}

</style>
</head>

<body>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="container">

    <div class="title">
        <h1>✨ Todo App</h1>
        <p>Plan your day beautifully</p>
    </div>

    <div class="clock">
        <div id="time">00:00:00</div>
        <div id="date">Loading...</div>
    </div>

    <div class="inputBox">
        <input type="text" id="taskInput" placeholder="Enter your task...">
        <button onclick="addTask()">+</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
        Made with ❤️💙 by Karan Rathod
    </div>

</div>

<script>

const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");

function addTask(){

    if(taskInput.value.trim() === ""){
        alert("Please enter a task!");
        return;
    }

    let li = document.createElement("li");

    let span = document.createElement("span");
    span.innerText = taskInput.value;
    span.classList.add("task");

    let actions = document.createElement("div");
    actions.classList.add("actions");

    let doneBtn = document.createElement("button");
    doneBtn.innerHTML = "✓";
    doneBtn.classList.add("doneBtn");

    doneBtn.onclick = function(){
        span.classList.toggle("completed");
    }

    let deleteBtn = document.createElement("button");
    deleteBtn.innerHTML = "🗑";
    deleteBtn.classList.add("deleteBtn");

    deleteBtn.onclick = function(){
        li.remove();
    }

    actions.appendChild(doneBtn);
    actions.appendChild(deleteBtn);

    li.appendChild(span);
    li.appendChild(actions);

    taskList.appendChild(li);

    taskInput.value = "";
}

taskInput.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        addTask();
    }
});

function updateClock(){

    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    let ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;
    hours = hours ? hours : 12;

    hours = String(hours).padStart(2,'0');
    minutes = String(minutes).padStart(2,'0');
    seconds = String(seconds).padStart(2,'0');

    document.getElementById("time").innerHTML =
    `${hours}:${minutes}:${seconds} ${ampm}`;

    const options = {
        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    };

    document.getElementById("date").innerHTML =
    now.toLocaleDateString('en-US', options);
}

setInterval(updateClock,1000);

updateClock();

</script>

</body>
</html>
